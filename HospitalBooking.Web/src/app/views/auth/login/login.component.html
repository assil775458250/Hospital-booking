<div class="login-page" dir="rtl">
  <div class="login-card">
    <div class="login-header">
      <img src="/images/yusr.jpeg" alt="شعار يُسر" class="login-logo" />
      <h1 class="login-title">تسجيل الدخول</h1>
      <p class="login-subtitle">نظام يُسر لإدارة حجز المواعيد الطبية</p>
    </div>

    @if (vm.errorMessage) {
      <div class="error-banner" role="alert">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ vm.errorMessage }}</span>
      </div>
    }

    <form (ngSubmit)="vm.login()" class="login-form">
      <div class="form-group">
        <label for="emailOrPhone" class="form-label">البريد الإلكتروني أو رقم الهاتف</label>
        <input
          type="text"
          id="emailOrPhone"
          name="emailOrPhone"
          class="form-input"
          placeholder="example@mail.com أو 05xxxxxxxx"
          [(ngModel)]="vm.emailOrPhone"
          [disabled]="vm.isLoading"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">كلمة المرور</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="أدخل كلمة المرور"
          [(ngModel)]="vm.password"
          [disabled]="vm.isLoading"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="submit-btn" [disabled]="vm.isLoading">
        @if (vm.isLoading) {
          <span class="spinner"></span>
          <span>جاري التحقق...</span>
        } @else {
          <span>تسجيل الدخول</span>
        }
      </button>
    </form>
  </div>
</div>
